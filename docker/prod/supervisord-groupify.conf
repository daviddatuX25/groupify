[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0

; All programs run as www-data (rootless). Their output goes to real rotating
; files under /var/log/supervisor — the docker stdout pipe is root-owned and
; cannot be opened by the children (EACCES). The entrypoint tails the logs.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/nginx-err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/php-fpm-err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2

[program:queue]
command=php /var/www/html/artisan queue:work --sleep=1 --tries=3
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/queue.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/queue-err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2

[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/reverb.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/reverb-err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2

[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/var/log/supervisor/scheduler-err.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
; the below section must remain in the config file for RPC
; (supervisorctl/web interface) to work, additional interfaces may be
; added by defining them in separate rpcinterface: sections
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock ; use a unix:// URL  for a unix socket
