name: groupify-dev

services:
  app:
    build: .
    container_name: groupify-dev
    ports:
      - "8000:8000"   # Laravel (artisan serve)
      - "8082:8080"   # Reverb WebSocket (8081 is the prod stack; dev now coexists)
      - "5173:5173"   # Vite dev server
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8000
      # DB/broadcast/queue intentionally NOT set here: .env owns runtime values,
      # and phpunit owns test values (compose env would leak into tests via $_SERVER)
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: 8082
      VITE_REVERB_SCHEME: http
    working_dir: /var/www/html
    restart: unless-stopped

  # One-off commands: docker compose run --rm app bash scripts/dev-bootstrap.sh
