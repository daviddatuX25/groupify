name: groupify-prod

services:
  # Local test rig for the production image (6-3). Dokploy runs the same image.
  app-prod:
    image: groupify-app-prod
    container_name: groupify-app-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # The Reverb app key is BAKED into the JS bundle — set a real random
        # value for production and pass the same value as REVERB_APP_KEY below.
        # NOTE: these use GROUPIFY_* variable names on purpose — the Laravel
        # dev .env defines VITE_REVERB_* and would hijack plain ${VITE_...}
        # substitution (that bug shipped ws://localhost:8080 into the bundle).
        VITE_REVERB_HOST: ${GROUPIFY_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${GROUPIFY_REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${GROUPIFY_REVERB_SCHEME:-http}
        VITE_REVERB_APP_KEY: ${GROUPIFY_REVERB_APP_KEY:-groupify-prod-key}
    ports:
      - "8081:80" # nginx (WS /app proxied inside; host port differs from dev)
    environment:
      APP_ENV: production
      APP_URL: http://localhost:8081
      # APP_KEY: generated per-deploy by the entrypoint (persisted on the volume)
      APP_KEY: ${GROUPIFY_APP_KEY:-}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/data/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${GROUPIFY_REVERB_APP_ID:-groupify-prod}
      REVERB_APP_KEY: ${GROUPIFY_REVERB_APP_KEY:-groupify-prod-key}
      REVERB_APP_SECRET: ${GROUPIFY_REVERB_APP_SECRET:-groupify-prod-secret}
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      DB_BUSY_TIMEOUT: 30000
      DB_JOURNAL_MODE: wal
    volumes:
      - groupify-sqlite:/var/www/html/database/data
      - groupify-storage:/var/www/html/storage
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_BIND_SERVICE # nginx master binds :80 as www-data
    # Drop the dangerous capabilities; keep what php-fpm (setuid to www-data)
    # and nginx (:80) need. Full cap_drop breaks the entrypoint + php-fpm.
    cap_drop:
      - NET_RAW
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_PTRACE
      - MKNOD
      - AUDIT_WRITE
      - SETFCAP
    restart: unless-stopped

volumes:
  groupify-sqlite:
  groupify-storage:
