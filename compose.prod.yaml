services:
  # Local test rig for the production image (6-3). Dokploy runs the same image.
  app-prod:
    image: groupify-app-prod
    container_name: groupify-app-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: 8081
        VITE_REVERB_SCHEME: http
        VITE_REVERB_APP_KEY: groupify-prod-key
    ports:
      - "8081:80" # nginx (WS /app proxied inside; host port differs from dev)
    environment:
      APP_ENV: production
      APP_URL: http://localhost:8081
      APP_KEY: ${APP_KEY:-base64:5x0xZz1yPz3wQ7mF9kC2vN4bR6tY8uA1dE3gH5jK7L}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: groupify-prod
      REVERB_APP_KEY: groupify-prod-key
      REVERB_APP_SECRET: groupify-prod-secret
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - groupify-sqlite:/var/www/html/database
      - groupify-storage:/var/www/html/storage
    restart: unless-stopped

volumes:
  groupify-sqlite:
  groupify-storage:
