name: groupify-prod

services:
  # Local test rig for the production image (6-3). Dokploy runs the same image.
  app-prod:
    image: groupify-app-prod
    container_name: groupify-app-prod
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # The Reverb app key is BAKED into the JS bundle — set a real random
        # value for production and pass the same value as REVERB_APP_KEY below.
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-groupify-prod-key}
    ports:
      - "8081:80" # nginx (WS /app proxied inside; host port differs from dev)
    environment:
      APP_ENV: production
      APP_URL: http://localhost:8081
      # APP_KEY: generated per-deploy by the entrypoint (persisted on the volume)
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/data/database.sqlite
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-groupify-prod}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-groupify-prod-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-groupify-prod-secret}
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      DB_BUSY_TIMEOUT: 30000
      DB_JOURNAL_MODE: wal
    volumes:
      - groupify-sqlite:/var/www/html/database/data
      - groupify-storage:/var/www/html/storage
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
    restart: unless-stopped

volumes:
  groupify-sqlite:
  groupify-storage:
